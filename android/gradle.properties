# Enable necessary AndroidX features
android.useAndroidX=true
android.enableJetifier=true

# Kotlin & JVM memory optimizations
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8

# Enable parallel and daemon for faster builds
org.gradle.parallel=true
org.gradle.daemon=true

# Disable older R8 to use full shrinker
android.enableR8.fullMode=true

# Flutter gradle configs
flutter.minSdkVersion=21
flutter.targetSdkVersion=34
flutter.compileSdkVersion=34
flutter.versionName=1.0
flutter.versionCode=1

# Prevent "obsolete source/target 1.8" warnings
kotlin.jvm.target.validation.mode=ignore

# Fix Kotlin daemon + Gradle 8 issues
kotlin.incremental=true
kotlin.code.style=official
